plugins { id 'com.android.application' }
android {
    namespace 'cn.album.send'
    compileSdk 36
    defaultConfig { applicationId 'cn.album.send'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.1.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*'] } }
}
dependencies {
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.9.24")
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'eu.agno3.jcifs:jcifs-ng:2.1.10'
    implementation 'org.slf4j:slf4j-nop:1.7.36'
    testImplementation 'junit:junit:4.13.2'
}
tasks.withType(Test).configureEach {
    def localSmbTest = System.getenv('ALBUM_SMB_TEST') == '1'
    inputs.property('localSmbTest', localSmbTest)
    if (localSmbTest) { outputs.upToDateWhen { false } }
}
